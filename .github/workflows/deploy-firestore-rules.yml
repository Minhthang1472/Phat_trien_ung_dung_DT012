name: Deploy Firestore rules

on:
  push:
    branches: [main]
    paths:
      - firestore.rules
      - firebase.json
      - .firebaserc
      - .github/workflows/deploy-firestore-rules.yml
  workflow_dispatch:

permissions:
  contents: read

# Không huỷ giữa chừng một lần deploy rules đang chạy.
concurrency:
  group: deploy-firestore-rules
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # Cho phép CI xanh khi repo chưa cấu hình service account; chỉ cảnh báo.
      - name: Check deployment credentials
        id: credentials
        env:
          SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -n "$SERVICE_ACCOUNT" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::FIREBASE_SERVICE_ACCOUNT chưa được cấu hình; bỏ qua deploy Firestore rules."
          fi

      - name: Authenticate to Google Cloud
        if: steps.credentials.outputs.available == 'true'
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Install Firebase CLI
        if: steps.credentials.outputs.available == 'true'
        run: npm install --global firebase-tools@13

      - name: Deploy Firestore rules
        if: steps.credentials.outputs.available == 'true'
        run: firebase deploy --only firestore:rules --project ptud-dt012 --non-interactive
