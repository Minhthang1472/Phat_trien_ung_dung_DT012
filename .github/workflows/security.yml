name: Security checks

on:
  push:
  pull_request:

jobs:
  python-audit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/backend-ai
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip pip-audit
      - run: pip-audit -r requirements.txt

  backend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/backend-ai
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: src/backend-ai/requirements-dev.txt
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements-dev.txt
      - run: pytest

  mobile-audit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/mobile-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/mobile-app/package-lock.json
      - run: npm ci
      # Expo SDK 57 kéo theo @expo/cli -> zod v3 (advisory chưa có bản vá
      # không phá vỡ tương thích). Chỉ chặn ở mức critical; high/moderate
      # vẫn được in ra để theo dõi.
      - run: npm audit --omit=dev --audit-level=critical