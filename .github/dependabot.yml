version: 2
updates:
  - package-ecosystem: pip
    directory: /src/backend-ai
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      python-dependencies:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: npm
    directory: /src/mobile-app
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      mobile-dependencies:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    # Expo SDK cần nâng theo lô và kiểm tra native; không tự động nhảy major.
    ignore:
      - dependency-name: "expo"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-native"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5

  - package-ecosystem: docker
    directory: /src/backend-ai
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
